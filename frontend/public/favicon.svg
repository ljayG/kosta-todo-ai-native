<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 완료율 링 모양 아이콘. 색은 App.css의 --forest / --forest-soft 값과 같다 -->
  <style>
    .track { stroke: #dfeee5; }
    .ring, .check { stroke: #2e6a4f; }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #1f3529; }
      .ring, .check { stroke: #5fb98d; }
    }
  </style>
  <circle class="track" cx="16" cy="16" r="12" fill="none" stroke-width="4"/>
  <circle class="ring" cx="16" cy="16" r="12" fill="none" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="56.5 75.4" transform="rotate(-90 16 16)"/>
  <path class="check" d="M11 16.5l3.5 3.5L21 13" fill="none" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
